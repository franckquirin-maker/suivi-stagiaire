services:
  db:
    image: mysql:8.0
    container_name: suivi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-suivi_absences}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USER:-suivi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-suivi_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - suivi_network

  backend:
    build:
      context: ./backend
    container_name: suivi_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-suivi_absences}
      DB_USER: ${DB_USER:-suivi_user}
      DB_PASSWORD: ${DB_PASSWORD:-suivi_pass}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.3.32:5173}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - suivi_network

  frontend:
    build:
      context: ./frontend
    container_name: suivi_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://192.168.3.32:8080}/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - suivi_network

volumes:
  db_data:
  frontend_node_modules:

networks:
  suivi_network:
    driver: bridge
